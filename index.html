<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BM Year 1 Modular Learning App</title>

<style>
body { font-family: Arial; background: #f5f5f5; padding: 20px; }
.app { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 20px; }
button { padding: 12px; font-size: 18px; margin: 5px; }
.word-box { font-size: 60px; text-align: center; margin: 20px; }
.result { font-size: 20px; text-align: center; margin-top: 10px; }
</style>
</head>

<body>
<div class="app">

<h2 style="text-align:center;">📘 BM App</h2>
<p style="text-align:center;">✨ Cikgu Khaw Mee Jia ✨</p>

<div class="word-box" id="targetWord">a</div>

<div style="text-align:center;">
<button id="micBtn" onclick="startListening()">🎤 Speak</button>
<button onclick="nextWord()">➡️ Next</button>
</div>

<div class="result" id="voiceResult">Result here</div>

</div>

<script>

const modules = [
{
  words: ["a","e","i","o","u"],
  voiceAnswers: [
    ["a","ah","uh"],
    ["e","eh","er","air"],
    ["i","ee","eye"],
    ["o","oh"],
    ["u","oo","you","woo"]
  ]
}
];

let currentWordIndex = 0;

function cleanText(text){
  return text.toLowerCase().trim();
}

function getAcceptedVoiceAnswers(index){
  return modules[0].voiceAnswers[index];
}

function nextWord(){
  currentWordIndex = (currentWordIndex + 1) % modules[0].words.length;
  document.getElementById("targetWord").textContent = modules[0].words[currentWordIndex];
  document.getElementById("voiceResult").textContent = "";
}

function startListening(){

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    document.getElementById("voiceResult").textContent = "Use Chrome";
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "ms-MY";

  const micBtn = document.getElementById("micBtn");
  micBtn.disabled = true;

  document.getElementById("voiceResult").textContent = "🎧 Listening...";
  recognition.start();

  recognition.onresult = function(event){

    const spoken = cleanText(event.results[0][0].transcript);
    const accepted = getAcceptedVoiceAnswers(currentWordIndex);

    const correct =
      accepted.includes(spoken) ||
      accepted.some(a => spoken.includes(a)) ||
      accepted.some(a => a.includes(spoken));

    document.getElementById("voiceResult").textContent =
      correct ? "✅ Betul!" : "🎤 Cuba lagi... (" + spoken + ")";

    micBtn.disabled = false;
  };

  recognition.onerror = function(){
    document.getElementById("voiceResult").textContent = "🎤 Cuba lagi...";
    micBtn.disabled = false;
  };

  recognition.onend = function(){
    micBtn.disabled = false;
  };

}

</script>

</body>
</html>
